<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0B1B3D" />
    <title>You're offline — TICKR</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #050b18; color: #f8fafc; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
      main { width: min(100%, 440px); text-align: center; }
      img { width: 72px; height: 72px; margin-bottom: 24px; }
      h1 { margin: 0 0 12px; font-size: clamp(1.8rem, 6vw, 2.5rem); letter-spacing: -0.04em; }
      p { margin: 0 auto 28px; max-width: 34ch; color: #aab6ca; line-height: 1.65; }
      a { display: inline-flex; min-height: 46px; align-items: center; justify-content: center; border-radius: 12px; padding: 0 20px; background: #2c68f6; color: white; font-weight: 650; text-decoration: none; }
      a:focus-visible { outline: 3px solid #9bb9ff; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="TICKR" width="72" height="72" />
      <h1>You're offline</h1>
      <p>Reconnect to the internet to see live markets and your latest account activity.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
